model_list:
  # ---- Mac (M5 Max) 上的 DeepSeek-V4-Flash-0731 -----------------------------
  - model_name: deepseek-v4-flash
    litellm_params:
      # 前缀用 hosted_vllm/，不要用 openai/。两者都走 OpenAI 兼容协议，区别在流式用量：
      # Spark 上的 TensorFold 引擎把 usage 放在带 finish_reason 的最后一块里，而不是单独的
      # `choices: []` 块。LiteLLM 1.100.x 及更早版本的 openai/ 路径遇到这种写法会丢掉上游
      # usage，改用自己估算的 token 数，prompt_tokens_details.cached_tokens 随之消失，客户端
      # （DS Harness 等）看到的缓存命中永远是 0；1.101.0 起上游已修。hosted_vllm/ 路径在
      # 新旧版本上都原样保留上游 usage（实测 1.97.0、1.99.0、1.111.0），reasoning_effort 也都
      # 能传到上游，所以升级后仍保留这个前缀：用 ./install.sh <版本> 回退到旧版时不会再丢。
      # 副作用：/v1/messages 改为翻译成上游的 /v1/chat/completions（原先是 /v1/responses）；
      # /v1/responses 仍然原样转给上游。
      model: hosted_vllm/deepseek-v4-flash
      api_base: os.environ/DS4_API_BASE
      api_key: os.environ/DS4_API_KEY
      # 冷前缀 prefill 是几十秒级（Claude Code 那类 25k token 系统提示更久）。
      # LiteLLM 默认超时会把请求误杀，必须调大。
      timeout: 600
      stream_timeout: 600
      # Mac 端 --batched-session 2，网关层限到 2，让排队发生在这边而不是 ds4 里，
      # 行为更可控（超出的请求在网关排队，而不是打过去干等）。
      max_parallel_requests: 2

  # ---- 本地已有的 qwen3.6 ----------------------------------------------------
  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6
      api_base: os.environ/QWEN_API_BASE
      api_key: os.environ/QWEN_API_KEY
      timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # 上游返回的非标准字段不至于让请求整个失败
  drop_params: true
  # 请求/响应日志，排查用；不需要可以删
  set_verbose: false
